<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cody Fischer | Mechanical Engineering</title>

    <style>

        /* Page setup */
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            position: relative;
        }
/* Topographic contour lines */

body::before {
    content: "";

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: -1;

    opacity: 0.25;

    background-image:
        repeating-radial-gradient(
            ellipse at 20% 30%,
            transparent 0px,
            transparent 35px,
            #9da99c 37px,
            transparent 40px,
            transparent 75px
        ),
        repeating-radial-gradient(
            ellipse at 80% 70%,
            transparent 0px,
            transparent 50px,
            #9da99c 52px,
            transparent 55px,
            transparent 100px
        );

    pointer-events: none;
}
        /* Introduction section */
        .intro {
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* Small heading */
        .intro p {
            color: #9da99c;
            letter-spacing: 4px;
            font-size: 14px;
        }

        /* Your name */
        .intro h1 {
            font-size: 80px;
            margin: 15px 0;
        }

        /* Description */
        .intro h2 {
            font-size: 20px;
            font-weight: normal;
            color: #aaa;
        }

    </style>

</head>


<body>

    <section class="intro">

        <p>MECHANICAL ENGINEERING</p>

        <h1>CODY FISCHER</h1>

        <h2>
            Senior Mechanical Engineering Student @ University of Arizona
            <br>
            Mechanical Engineering Intern @ Parker Aerospace
        </h2>

    </section>

</body>

</html>
